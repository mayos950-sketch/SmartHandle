<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfe6ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SmartHandle</title>
<style>
:root{--bg:#f7fbff;--panel:#ffffff;--panel2:#eef8ff;--gold:#b7dcff;--text:#294256;--muted:#6f8799}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#dff2ff,#f7fbff 38%);color:var(--text);min-height:100vh}
.wrap{max-width:780px;margin:auto;padding:22px 16px 90px}
header{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.logo{width:66px;height:66px;border-radius:18px;overflow:hidden;border:1px solid rgba(167,201,231,.55)} .logo img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:34px}.sub{color:var(--muted);margin-top:4px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.tab{border:1px solid #d7e9f6;background:#ffffff;color:#3e6280;padding:12px 6px;border-radius:14px;font-weight:700}.tab.active{background:var(--gold);color:#385b7a}
.search{width:100%;background:#ffffff;border:1px solid #d3e5f3;color:#294256;padding:13px 14px;border-radius:14px;font-size:16px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 8px 24px rgba(115,157,190,.10);box-shadow:0 8px 22px rgba(115,157,190,.12);border:1px solid #d7e9f6;border-radius:18px;padding:14px;margin:10px 0}
.row{display:flex;gap:12px;align-items:center}.picWrap{position:relative;width:96px;height:96px;flex:0 0 96px}.pic{width:96px;height:96px;border-radius:20px;box-shadow:0 6px 18px rgba(115,157,190,.14);object-fit:cover;background:#edf6fc}.camMini{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border:0;border-radius:999px;background:#ffffffdd;box-shadow:0 4px 10px rgba(115,157,190,.18);font-size:16px;cursor:pointer}.grow{flex:1}.name{font-size:20px;font-weight:800}.meta{color:var(--muted);font-size:14px}.buy{color:var(--gold);font-weight:800;margin-top:4px}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:12px;padding:9px 12px;font-weight:800;background:#e8f4ff;color:#416784}.btn.gold{background:var(--gold);color:#385b7a}.btn.red{background:#ffe6e3;color:#8a4a45}
.fab{position:fixed;right:22px;bottom:24px;width:62px;height:62px;border-radius:50%;border:0;background:var(--gold);font-size:38px}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:100%;max-width:780px;margin:auto;background:#ffffff;border-radius:24px 24px 0 0;padding:20px 16px 28px;max-height:92vh;overflow:auto}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;background:#edf6fc;border:1px solid #d3e5f3;color:#294256;border-radius:12px;padding:12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{width:110px;height:110px;object-fit:cover;border-radius:14px;margin-top:8px}
.gear{position:fixed;left:22px;bottom:24px;width:54px;height:54px;border-radius:50%;border:1px solid rgba(167,201,231,.55);background:#ffffff;color:#3e6280;font-size:26px;box-shadow:0 8px 24px #0002}
.settings{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:25}.settings.show{display:flex}.settings .sheet{padding-bottom:34px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.badge{font-size:12px;background:#d9ecfb;color:#53799a;padding:2px 6px;border-radius:999px}
.catGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.catBtn{border:1px solid #d7e9f6;background:#eef8ff;border-radius:16px;padding:12px 8px;display:flex;align-items:center;justify-content:center;min-height:58px;font-size:26px;cursor:pointer}
.catBtn.active{background:#bfe6ff;box-shadow:0 4px 14px rgba(115,157,190,.16);outline:2px solid #8bcdf5}
.catInline{font-size:24px;line-height:1}
@media (max-width:480px){.catGrid{grid-template-columns:repeat(4,1fr)} .catBtn{min-height:54px;font-size:24px}}


.homeCats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 16px}
.homeCat{border:1px solid #d4e7f5;background:#fff;border-radius:22px;min-height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:40px;box-shadow:0 7px 20px rgba(115,157,190,.10);transition:.15s}.homeCat span{font-size:11px;font-weight:700;color:#6b879b;line-height:1.1}
.homeCat.active{background:#bfe6ff;transform:translateY(-2px);box-shadow:0 9px 24px rgba(115,157,190,.20);outline:2px solid #8bcdf5}
.catBtn{min-height:82px!important;font-size:34px!important;border-radius:20px!important;flex-direction:column;gap:3px}.catBtn span{font-size:10px;font-weight:700;color:#6b879b;line-height:1.1}
.quick{display:grid;grid-template-columns:1fr 56px;gap:8px;margin:10px 0}
.quick input{margin:0}
.miniStat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 2px}
.stat{background:#fff;border:1px solid #d7e9f6;border-radius:16px;padding:10px;text-align:center;box-shadow:0 4px 14px rgba(115,157,190,.08)}
.stat strong{display:block;font-size:22px;color:#365b78}
.stat span{font-size:11px;color:#7890a2}
@media(max-width:480px){
  .homeCats{grid-template-columns:repeat(4,1fr);gap:9px}
  .homeCat{min-height:88px;font-size:36px}
  .pic{width:90px;height:90px}
}


.extraBox{background:#fff;border:1px solid #d7e9f6;border-radius:18px;padding:12px;margin:10px 0 14px;box-shadow:0 6px 18px rgba(115,157,190,.08)}
.extraTitle{font-weight:800;margin-bottom:8px;color:#426985}
.extraInput{display:grid;grid-template-columns:1fr 52px;gap:8px}
.extraList{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.extraChip{display:inline-flex;align-items:center;gap:6px;background:#eef7ff;border:1px solid #d7e9f6;border-radius:999px;padding:7px 10px;color:#426985}
.extraChip button{border:0;background:none;color:#8a4a45;font-weight:800;font-size:15px}
.camBtn{display:inline-flex;align-items:center;gap:8px}


.versionMark{position:fixed;right:10px;top:8px;font-size:10px;color:#8aa1b3;background:#ffffffcc;border:1px solid #d7e9f6;border-radius:999px;padding:3px 7px;z-index:50}


.cameraQuick{position:fixed;right:22px;bottom:98px;width:58px;height:58px;border-radius:50%;border:1px solid #d4e7f5;background:#fff;font-size:27px;box-shadow:0 8px 22px rgba(115,157,190,.18);z-index:15}
.cameraQuick:active{transform:scale(.97)}


.sendBar{display:none;margin:12px 0}
.sendBar.show{display:block}
.sendBtn{width:100%;border:0;border-radius:18px;padding:16px 16px;font-size:19px;font-weight:900;background:#9ed8ff;color:#214d6b;box-shadow:0 8px 22px rgba(80,145,190,.20);cursor:pointer}


.cameraModal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.cameraModal.show{display:flex}
.cameraPanel{width:min(720px,100%);background:#fff;border-radius:22px;padding:14px}
.cameraPanel video{width:100%;max-height:65vh;background:#000;border-radius:16px;object-fit:cover}
.cameraActions{display:flex;gap:10px;margin-top:10px}
.cameraActions button{flex:1}

</style>
</head>
<body><div class="versionMark">v17</div>
<div class="wrap">
<header><div class="logo"><img src="icon-192.png"></div><div><h1>SmartHandle</h1><div class="sub">Bestand • Fehlt • Einkaufsliste</div></div></header>
<input id="search" class="search" placeholder="Artikel suchen …">
<div class="quick">
  <input id="quickName" placeholder="Schnell hinzufügen …">
  <button id="quickAdd" class="btn gold" style="font-size:28px" aria-label="Hinzufügen">＋</button>
</div>
<div class="homeCats" id="homeCats">
  <button type="button" class="homeCat active" data-homecat="" aria-label="Alle">🏠<span>Alle</span></button>
  <button type="button" class="homeCat" data-homecat="Kühlschrank" aria-label="Kühlschrank">🧊<span>Kühlschrank</span></button>
  <button type="button" class="homeCat" data-homecat="Gefrierschrank" aria-label="Gefrierschrank">❄️<span>Gefrierfach</span></button>
  <button type="button" class="homeCat" data-homecat="Vorrat" aria-label="Vorrat">🥫<span>Vorrat</span></button>
  <button type="button" class="homeCat" data-homecat="Getränke" aria-label="Getränke">🥤<span>Getränke</span></button>
  <button type="button" class="homeCat" data-homecat="Bad" aria-label="Bad">🧴<span>Bad</span></button>
  <button type="button" class="homeCat" data-homecat="Haushalt" aria-label="Haushalt">🧽<span>Haushalt</span></button>
  <button type="button" class="homeCat" data-homecat="Sonstiges" aria-label="Sonstiges">📦<span>Sonstiges</span></button>
</div><div class="meta" style="text-align:center;margin:-8px 0 8px">Kategorie antippen zum Wechseln</div>
<div class="miniStat">
  <div class="stat"><strong id="sAll">0</strong><span>Artikel</span></div>
  <div class="stat"><strong id="sMissing">0</strong><span>Fehlt</span></div>
  <div class="stat"><strong id="sBuy">0</strong><span>Einkauf</span></div>
</div>
<div style="margin:10px 0 4px"><button id="addTopBtn" class="btn gold" style="width:100%;font-size:30px;padding:10px" aria-label="Artikel hinzufügen">＋</button></div>
<div id="extraBox" class="extraBox" style="display:none"><div class="extraTitle">Zusätzlich kaufen</div><div class="extraInput"><input id="extraName" placeholder="z. B. Blumen, Batterien …"><button id="extraAdd" class="btn gold" aria-label="Extra hinzufügen">＋</button></div><div id="extraList" class="extraList"></div></div>
<div id="sendBar" class="sendBar show"><button id="sendDirectBtn" class="sendBtn">📤 Einkaufszettel senden</button><div class="meta" style="text-align:center;margin-top:6px">Fehlende Artikel + Extras werden zusammen geteilt</div></div>
<div class="tabs">
<button class="tab active" data-tab="stock">Bestand <span id="c1" class="badge">0</span></button>
<button class="tab" data-tab="missing">Fehlt <span id="c2" class="badge">0</span></button>
<button class="tab" data-tab="shopping">Einkauf <span id="c3" class="badge">0</span></button>
</div>
<div id="list"></div>
</div>
<button id="cameraQuick" class="cameraQuick" aria-label="Kamera">📷</button>
<button id="addBtn" class="fab">+</button>

<button id="gearBtn" class="gear" aria-label="Einstellungen">⚙️</button>

<div class="settings" id="settingsModal"><div class="sheet">
<h2>Einstellungen</h2>
<div class="controls">

<button class="btn" id="backupBtn">Backup</button>
<button class="btn" id="importBtn">Import</button><button class="btn" id="resetBoughtBtn" aria-label="Einkauf zurücksetzen">↺</button>
</div>
<div class="controls" style="margin-top:14px">
<button class="btn gold" id="settingsClose" style="flex:1">Fertig</button>
</div>
</div></div>

<div class="modal" id="modal"><div class="sheet">
<h2 id="formTitle">Artikel hinzufügen</h2>
<input type="hidden" id="editId">
<label>Bild</label><div class="controls"><button type="button" class="btn gold" id="cameraBtn">📷 Foto machen</button><button type="button" class="btn" id="galleryBtn">🖼️ Foto wählen</button></div><input id="photo" type="file" accept="image/*" capture="environment" style="display:none"><input id="galleryPhoto" type="file" accept="image/*" style="display:none"><img id="preview" class="preview" style="display:none">
<label>Artikelname</label><input id="name" placeholder="z. B. Milch">
<label>Kategorie</label>
<input type="hidden" id="category" value="Kühlschrank">
<div class="catGrid" id="catGrid">
  <button type="button" class="catBtn active" data-cat="Kühlschrank" aria-label="Kühlschrank">🧊<span>Kühlschrank</span></button>
  <button type="button" class="catBtn" data-cat="Gefrierschrank" aria-label="Gefrierschrank">❄️<span>Gefrierfach</span></button>
  <button type="button" class="catBtn" data-cat="Vorrat" aria-label="Vorrat">🥫<span>Vorrat</span></button>
  <button type="button" class="catBtn" data-cat="Getränke" aria-label="Getränke">🥤<span>Getränke</span></button>
  <button type="button" class="catBtn" data-cat="Bad" aria-label="Bad">🧴<span>Bad</span></button>
  <button type="button" class="catBtn" data-cat="Haushalt" aria-label="Haushalt">🧽<span>Haushalt</span></button>
  <button type="button" class="catBtn" data-cat="Sonstiges" aria-label="Sonstiges">📦<span>Sonstiges</span></button>
</div>
<div class="grid2"><div><label>Bestand</label><input id="stock" type="number" min="0" value="0"></div><div><label>Sollbestand</label><input id="target" type="number" min="0" value="1"></div></div>
<label>Notiz</label><textarea id="note" rows="3"></textarea>
<div class="controls"><button id="saveBtn" class="btn gold">Speichern</button><button id="cancelBtn" class="btn">Abbrechen</button></div>
</div></div>
<input id="restoreInput" type="file" accept=".json,application/json" hidden>
<input id="inlinePhotoInput" type="file" accept="image/*" capture="environment" hidden>
<input id="quickCameraInput" type="file" accept="image/*" capture="environment" hidden>


<div id="cameraModal" class="cameraModal">
  <div class="cameraPanel">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <canvas id="cameraCanvas" style="display:none"></canvas>
    <div class="cameraActions">
      <button id="takePhotoBtn" class="btn gold">📸 Aufnehmen</button>
      <button id="closeCameraBtn" class="btn">Abbrechen</button>
    </div>
  </div>
</div>

<script>

async function clearOldAppCache(){
  try{
    if("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
}
clearOldAppCache();

const KEY="smarthandle-v3";const EXTRA_KEY="smarthandle-extras-v1";let items=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem("smarthandle-v2")||localStorage.getItem("smarthandle-v1")||"[]");let extras=JSON.parse(localStorage.getItem(EXTRA_KEY)||"[]");let tab="stock";let photoData="";let homeCat="";let photoTargetId="";
const $=s=>document.querySelector(s);
const buy=i=>Math.max(0,(+i.target||0)-(+i.stock||0));
const CAT_ICON={
  "Kühlschrank":"🧊",
  "Gefrierschrank":"❄️",
  "Vorrat":"🥫",
  "Getränke":"🥤",
  "Bad":"🧴",
  "Haushalt":"🧽",
  "Sonstiges":"📦"
};
function catIcon(cat){ return CAT_ICON[cat] || "📦"; }
function setCategory(cat){
  $("#category").value = cat;
  document.querySelectorAll(".catBtn").forEach(b=>b.classList.toggle("active", b.dataset.cat===cat));
}
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(EXTRA_KEY,JSON.stringify(extras));render()}
function renderExtras(){
  const box=$("#extraBox"), list=$("#extraList");
  box.style.display = tab==="shopping" ? "block" : "none";
  list.innerHTML = extras.length ? extras.map((x,idx)=>`<span class="extraChip">${esc(x)} <button onclick="delExtra(${idx})">✕</button></span>`).join("") : '<span class="meta">Keine Extras.</span>';
}
function delExtra(idx){ extras.splice(idx,1); save(); }
function photoDataFromFile(f, cb){
  let r=new FileReader();
  r.onload=()=>{
    let img=new Image();
    img.onload=()=>{
      let max=1000,w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max}
      else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}
      let c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",0.78));
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
function render(){
 const missing=items.filter(i=>buy(i)>0);
 const shopping=items.filter(i=>buy(i)>0&&!i.bought);
 $("#c1").textContent=items.length;$("#c2").textContent=missing.length;$("#c3").textContent=shopping.length;
 $("#sAll").textContent=items.length;$("#sMissing").textContent=missing.length;$("#sBuy").textContent=shopping.length + extras.length;
 renderExtras();
 $("#sendBar").classList.add("show");
 const q=$("#search").value.trim().toLowerCase();
 let data=items.filter(i=>(!q||(`${i.name} ${i.category} ${i.note||""}`).toLowerCase().includes(q))&&(!homeCat||i.category===homeCat)&&(tab==="stock"||tab==="missing"&&buy(i)>0||tab==="shopping"&&buy(i)>0&&!i.bought));
 data.sort((a,b)=>(a.category||"").localeCompare(b.category||"")||(a.name||"").localeCompare(b.name||""));
 $("#list").innerHTML=data.length?data.map(i=>`<div class="card"><div class="row"><div class="picWrap"><img class="pic" src="${i.photo||'icon-192.png'}"><button class="camMini" aria-label="Foto" onclick="changePhoto(\'${i.id}\')">📷</button></div><div class="grow"><div class="name">${esc(i.name)}</div><div class="meta">${catIcon(i.category)} · Bestand ${i.stock} / Soll ${i.target}</div>${buy(i)>0?`<div class="buy">Kaufen: ${buy(i)}</div>`:'<div class="meta">Genug vorhanden</div>'}${i.note?`<div class="meta">${esc(i.note)}</div>`:''}</div></div><div class="controls"><button class="btn" onclick="chg('${i.id}',-1)">−1</button><button class="btn" onclick="chg('${i.id}',1)">+1</button>${buy(i)>0?`<button class="btn gold" onclick="done('${i.id}')">${i.bought?'Erledigt ✓':'Gekauft'}</button>`:''}<button class="btn" onclick="edit('${i.id}')">Bearbeiten</button><button class="btn red" onclick="del('${i.id}')">Löschen</button></div></div>`).join(""):'<div class="empty">Noch nichts hier.</div>'
}
function chg(id,d){let i=items.find(x=>x.id===id);i.stock=Math.max(0,(+i.stock||0)+d);if(buy(i)===0)i.bought=false;save()}
function done(id){let i=items.find(x=>x.id===id);i.bought=!i.bought;save()}
function changePhoto(id){photoTargetId=id;$("#inlinePhotoInput").click()}
function del(id){if(confirm("Artikel löschen?")){items=items.filter(x=>x.id!==id);save()}}
function openForm(i){$("#formTitle").textContent=i?"Artikel bearbeiten":"Artikel hinzufügen";$("#editId").value=(i&&i.id)||"";$("#name").value=(i&&i.name)||"";setCategory((i&&i.category)||"Kühlschrank");$("#stock").value=(i&&i.stock!=null)?i.stock:0;$("#target").value=(i&&i.target!=null)?i.target:1;$("#note").value=(i&&i.note)||"";photoData=(i&&i.photo)||"";$("#preview").src=photoData;$("#preview").style.display=photoData?"block":"none";$("#photo").value="";$("#modal").classList.add("show")}
function edit(id){openForm(items.find(x=>x.id===id))}
function makeId(){return "i-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9)}
$("#addBtn").onclick=()=>openForm(null);
$("#addTopBtn").onclick=()=>openForm(null);
$("#cancelBtn").onclick=()=>$("#modal").classList.remove("show");
$("#cameraBtn").onclick=()=>$("#photo").click();
$("#cameraQuick").onclick=()=>{
  openForm();
  setTimeout(openRealCamera,120);
};
$("#photo").onchange=e=>{
 let f=(e.target.files&&e.target.files[0]);if(!f)return;
 photoDataFromFile(f, data=>{photoData=data;$("#preview").src=photoData;$("#preview").style.display="block";});
};
$("#inlinePhotoInput").onchange=e=>{
 let f=(e.target.files&&e.target.files[0]);if(!f||!photoTargetId)return;
 photoDataFromFile(f, data=>{
   let item=items.find(x=>x.id===photoTargetId);
   if(item){ item.photo=data; save(); }
   photoTargetId="";
   $("#inlinePhotoInput").value="";
 });
};
$("#saveBtn").onclick=()=>{let n=$("#name").value.trim();if(!n)return alert("Artikelname fehlt.");let obj={id:$("#editId").value||makeId(),name:n,category:$("#category").value,stock:+$("#stock").value||0,target:+$("#target").value||0,note:$("#note").value.trim(),photo:photoData,bought:false};let x=items.findIndex(i=>i.id===obj.id);if(x>=0)items[x]={...items[x],...obj};else items.unshift(obj);$("#modal").classList.remove("show");save()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;render()});
$("#search").oninput=render;
$("#shareBtn").onclick=async()=>{let d=items.filter(i=>buy(i)>0&&!i.bought);let t="SmartHandle Einkaufsliste\n\n"+(d.length?d.map(i=>`• ${i.name}: ${buy(i)} kaufen`).join("\n"):"Nichts zu kaufen.");if(navigator.share){try{await navigator.share({title:"SmartHandle Einkaufsliste",text:t})}catch(e){}}else{await navigator.clipboard.writeText(t);alert("Liste kopiert.")}};
$("#backupBtn").onclick=()=>{let b=new Blob([JSON.stringify(items,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="SmartHandle-Backup.json";a.click()};
$("#importBtn").onclick=()=>$("#restoreInput").click();$("#restoreInput").onchange=e=>{let f=(e.target.files&&e.target.files[0]);if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(Array.isArray(d)){items=d;save();alert("Importiert.")}}catch{alert("Ungültige Datei.")}};r.readAsText(f)};
$("#quickAdd").onclick=()=>{
 const n=$("#quickName").value.trim(); if(!n)return;
 items.unshift({id:makeId(),name:n,category:homeCat||"Kühlschrank",stock:0,target:1,note:"",photo:"",bought:false});
 $("#quickName").value="";save();
};
$("#quickName").addEventListener("keydown",e=>{if(e.key==="Enter")$("#quickAdd").click()});
$("#extraAdd").onclick=()=>{let n=$("#extraName").value.trim(); if(!n)return; extras.push(n); $("#extraName").value=""; save();};
$("#extraName").addEventListener("keydown",e=>{if(e.key==="Enter")$("#extraAdd").click()});
document.getElementById("homeCats").addEventListener("click",e=>{
  const b=e.target.closest(".homeCat");
  if(!b)return;
  e.preventDefault();
  document.querySelectorAll(".homeCat").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  homeCat=b.dataset.homecat||"";
  render();
});
$("#resetBoughtBtn").onclick=()=>{items.forEach(i=>i.bought=false);save();$("#settingsModal").classList.remove("show")};
document.getElementById("catGrid").addEventListener("click",e=>{
  const b=e.target.closest(".catBtn");
  if(!b)return;
  e.preventDefault();
  setCategory(b.dataset.cat);
});
$("#gearBtn").onclick=()=>$("#settingsModal").classList.add("show");
$("#settingsClose").onclick=()=>$("#settingsModal").classList.remove("show");
$("#settingsModal").onclick=e=>{if(e.target===$("#settingsModal"))$("#settingsModal").classList.remove("show")};
setCategory("Kühlschrank");
render();
</script>
</body></html>
